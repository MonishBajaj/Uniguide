name: Scheduled jobs

# Each job runs only when its connection secret is set (Settings > Secrets and variables > Actions),
# so forks and fresh clones skip them quietly. See docs/SETUP.md, "Scheduled jobs".
on:
  schedule:
    - cron: "7 * * * *"     # notify: hourly, deadline reminders and update emails
    - cron: "17 3 * * *"    # monitor: daily, re-check official pages by demand
    - cron: "23 4 * * 1"    # research: weekly, outcome report and admission model gate
    - cron: "41 5 * * *"    # index: daily, crawl verified course-index pages
    - cron: "29 2 * * *"    # journeys: daily, recompute each active student's journey (stage, next steps)
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [notify, monitor, research, index, journeys]

concurrency:
  group: scheduled-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  notify:
    if: (github.event.schedule == '7 * * * *' || inputs.job == 'notify')
    runs-on: ubuntu-latest
    env:
      NOTIFIER_DATABASE_URL: ${{ secrets.NOTIFIER_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      SITE_URL: ${{ vars.SITE_URL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        if: env.NOTIFIER_DATABASE_URL != ''
      - uses: astral-sh/setup-uv@v5
        if: env.NOTIFIER_DATABASE_URL != ''
      - run: uv sync --frozen && uv run uniguide-worker notify
        if: env.NOTIFIER_DATABASE_URL != ''

  monitor:
    if: (github.event.schedule == '17 3 * * *' || inputs.job == 'monitor')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Gemini when its key exists, otherwise Claude, unless the EXTRACTOR variable says which.
      EXTRACTOR: ${{ vars.EXTRACTOR || (secrets.GEMINI_API_KEY != '' && 'gemini' || 'anthropic') }}
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        if: env.WORKER_DATABASE_URL != '' && (env.ANTHROPIC_API_KEY != '' || env.GEMINI_API_KEY != '')
      - uses: astral-sh/setup-uv@v5
        if: env.WORKER_DATABASE_URL != '' && (env.ANTHROPIC_API_KEY != '' || env.GEMINI_API_KEY != '')
      - run: uv sync --frozen && uv run uniguide-worker monitor --limit 50
        if: env.WORKER_DATABASE_URL != '' && (env.ANTHROPIC_API_KEY != '' || env.GEMINI_API_KEY != '')

  research:
    if: (github.event.schedule == '23 4 * * 1' || inputs.job == 'research')
    runs-on: ubuntu-latest
    env:
      ANALYST_DATABASE_URL: ${{ secrets.ANALYST_DATABASE_URL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        if: env.ANALYST_DATABASE_URL != ''
      - uses: astral-sh/setup-uv@v5
        if: env.ANALYST_DATABASE_URL != ''
      - run: uv sync --frozen && uv run uniguide-worker research outcomes && uv run uniguide-worker research train-admission && uv run uniguide-worker research insights
        if: env.ANALYST_DATABASE_URL != ''

  index:
    if: (github.event.schedule == '41 5 * * *' || inputs.job == 'index')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        if: env.WORKER_DATABASE_URL != '' && env.GEMINI_API_KEY != ''
      - uses: astral-sh/setup-uv@v5
        if: env.WORKER_DATABASE_URL != '' && env.GEMINI_API_KEY != ''
      - run: uv sync --frozen && uv run uniguide-worker index crawl --limit 30
        if: env.WORKER_DATABASE_URL != '' && env.GEMINI_API_KEY != ''

  # Calls the web app's token-guarded route a page at a time until it reports no next page.
  journeys:
    if: (github.event.schedule == '29 2 * * *' || inputs.job == 'journeys')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      JOURNEY_CRON_TOKEN: ${{ secrets.JOURNEY_CRON_TOKEN }}
    steps:
      - name: Recompute journeys
        if: env.SITE_URL != '' && env.JOURNEY_CRON_TOKEN != ''
        run: |
          after=""
          for page in $(seq 1 500); do
            body=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $JOURNEY_CRON_TOKEN" \
              "$SITE_URL/api/cron/journeys${after:+?after=$after}")
            echo "page $page: $body"
            after=$(echo "$body" | jq -r '.next // empty')
            [ -z "$after" ] && exit 0
          done
          echo "Stopped after 500 pages" && exit 1
